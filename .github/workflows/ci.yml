# PR CI per arch/deploy.md 14.1 + required status checks per arch/docs-git.md 23.4.
# Every action pinned to a commit SHA per arch/security.md 9.8; the vX.Y.Z comment is the
# human reference. Dependabot github-actions group keeps SHAs current.
# Adapted for the approved stack deviation (MasterPrompt.md 1.2): React+Vite SPA + Fastify,
# no Next.js/Prisma/Coolify steps. Gates grow at Step 12+ (eslint, e2e, size budgets,
# lifecycle-script allowlist check, license scan).
name: CI

on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Install slop + fd (slop file-discovery dependency; Ubuntu names it fdfind)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fd-find
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          pip install agent-slop-lint
      - run: slop lint --root .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
