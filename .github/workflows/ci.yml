# PR CI per arch/deploy.md 14.1 + required status checks per arch/docs-git.md 23.4.
# Every action pinned to a commit SHA per arch/security.md 9.8; the vX.Y.Z comment is the
# human reference. Dependabot github-actions group keeps SHAs current.
# Adapted for the approved stack deviation (MasterPrompt.md 1.2): React+Vite SPA + Fastify,
# no Next.js/Prisma/Coolify steps. Gates grow at Step 12+ (eslint, e2e, size budgets,
# lifecycle-script allowlist check, license scan).
name: CI

on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # slop history-aware rules (hotspots) read full git log
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      # Lifecycle-script allowlist gate (MasterPrompt.md 1.5, Wave 8)
      - run: node scripts/check-lifecycle-scripts.mjs
      - name: Install slop + fd/rg binaries (slop file discovery + content search)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fd-find ripgrep
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          pip install agent-slop-lint
      - run: slop lint --root .
      - run: npm run typecheck
      - run: npm run lint
      # Chromium for the REQ-030 axe sweep (tests/e2e/a11y.spec.ts)
      - run: npx playwright install --with-deps chromium
      # Coverage thresholds enforce the Step 15 gate (vitest.config.ts)
      - run: npm run test:coverage
      - run: npm run build
      # dependency-review-action removed: unsupported on private repos without GHAS.
      # Coverage: npm audit gate above + Dependabot alerts. Re-add when repo goes public
      # at first npm publish (MasterPrompt.md 1.5).
