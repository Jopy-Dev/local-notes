# Release packaging per ADR-007: no npm publish - a version tag builds, verifies,
# packs, and attaches the tarball to a GitHub Release on this private repo.
# Every action pinned to a commit SHA per arch/security.md 9.8.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the Release + upload the tarball asset

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Production audit gate with reviewed allowlist (scripts/audit-allowlist.json)
      - run: node scripts/check-audit.mjs
      - run: node scripts/check-lifecycle-scripts.mjs
      - run: npm run typecheck
      - run: npm run lint
      # Chromium for the REQ-030 axe sweep (tests/e2e/a11y.spec.ts)
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # prepack runs the full client+server build; the tarball carries dist only.
      - run: npm pack
      - name: Attach tarball to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" ./local-notes-*.tgz \
            --title "local-notes ${GITHUB_REF_NAME}" \
            --generate-notes
