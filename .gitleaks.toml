# Extends the default ruleset + a tight project allowlist (arch/scan-policy.md 26.3).
# Never broad regex that masks real findings - every entry traces to a verified false positive
# with a KNOWN_ISSUES.md reference (26.7).
[extend]
useDefault = true

[allowlist]
description = "project-local allowlist - keep tight"
paths = [
  '''(.*?)(jpg|jpeg|png|gif|webp|woff2?|ttf|otf|eot|ico)$''',
  '''node_modules/''',
  '''dist/''',
]
# Test fixtures use literal noteKey values (base64url of a relative path,
# e.g. "cmVuYW1lZC5tZA" = "renamed.md") - not credentials. Line-scoped to the
# noteKey/oldKey field so real secret shapes stay detectable.
# KNOWN_ISSUES.md Suppressions: gitleaks-notekey-fixtures-2026-07-04.
regexTarget = "line"
regexes = [
  '''(?:oldKey|noteKey): "[A-Za-z0-9_-]{6,64}"''',
]
